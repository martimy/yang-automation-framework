- host: ceos-01
  vendor: ceos
  username: admin
  intents:
    interfaces:
      - name: Ethernet1
        description: To SRL-01
        ip_address: 192.168.1.2
        prefix_length: 31
      - name: Ethernet2
        description: To SRL-02
        ip_address: 192.168.1.4
        prefix_length: 31

- host: srl-01
  vendor: srlinux
  username: admin
  intents:
    interfaces:
      - name: ethernet-1/1
        description: To cEOS-01
        ip_address: 192.168.1.3
        prefix_length: 31
        subinterface: 0
        network_instance: default
      - name: ethernet-1/2
        description: To SRL-02
        ip_address: 192.168.1.7
        prefix_length: 31
        subinterface: 0
        network_instance: default
    protocols:
      ospf:
        - name: main
          network_instance: default
          router_id: 10.0.0.1
          areas:
            - id: 0.0.0.0
              interfaces:
                - name: ethernet-1/1.0
                  enabled: true
                - name: ethernet-1/2.0
                  enabled: true
- host: srl-02
  vendor: srlinux
  username: admin
  intents:
    interfaces:
      - name: ethernet-1/1
        description: To cEOS-01
        ip_address: 192.168.1.5
        prefix_length: 31
        subinterface: 0
        network_instance: default
      - name: ethernet-1/2
        description: To SRL-01
        ip_address: 192.168.1.6
        prefix_length: 31
        subinterface: 0
        network_instance: default
