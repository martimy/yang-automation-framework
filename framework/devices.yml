- host: srl-01
  vendor: srlinux
  username: admin
  intents:
    interfaces:
      - name: ethernet-1/1
        description: To cEOS-01
        ip_address: 192.168.1.3
        prefix_length: 31
        network_instance: default
        subinterface: 0
      - name: ethernet-1/2
        description: To SRL-02
        ip_address: 192.168.1.7
        prefix_length: 31
        network_instance: default
        subinterface: 0
    protocols:
      ospf:
        - name: main
          network_instance: default
          router_id: 10.0.0.1
          areas:
            - id: 0.0.0.0
              interfaces:
                - name: ethernet-1/1.0
                  enabled: true
                  network_type: point-to-point
                - name: ethernet-1/2.0
                  enabled: true
                  network_type: point-to-point
